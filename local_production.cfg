# This is a deployment-buildout common to all sites.
# To test a deployment locally change the variables backupdir and vardir

[buildout]
extends =
    https://raw.githubusercontent.com/starzel/buildout/5.2.10/linkto/base.cfg

# If you want you can have you eggs picked
#allow-picked-versions = true

# comment out what you need
parts +=
# Choose one!
    zeoserver
    ${buildout:zeoclients}
    zeoclient_debug
#    ${buildout:zeo-multi-parts}
#    ${buildout:zeo-single-parts}
# Modify templates/supervisor.conf as needed for production!
#    ${buildout:supervisor-parts}
#    ${buildout:cron-parts}
#    ${buildout:varnish}
    backup
#    logrotate
    precompiler
#    nginx-conf

zeoclients +=
   zeoclient2

# Adjust to directory-setup of server. The default matches starzel's servers.
# Relative paths:
#backupdir = ${buildout:directory}/backup
#vardir = ${buildout:directory}/var
backupdir = ${buildout:directory}/backup/${buildout:site}
vardir    = ${buildout:directory}/var/${buildout:site}
logdir    = ${buildout:vardir}/log

# The starzel base.cfg sets "event-log = disable" to switch the event log off.
# plone.recipe.zope2instance does not read that as a switch though - it takes the
# value as a FILENAME, so every instance wrote its log to a file literally called
# "disable" in its part directory, and none of them produced an instance.log.
# The production buildout had collected 13 MB there since 2021, unnoticed.
# We want that log: it is where a failing viewlet or a broken add-on shows up.
#
# Set per client rather than once in zeoclient-base: the value is inherited
# verbatim, so a single setting would have both clients append to one file.

# Optional: Enable sentry
[zeoclient1]
event-log = ${buildout:logdir}/zeoclient1.log
#sentry_dsn = <YOURDSN>
#eggs += sentry-sdk

# Inherit sentry for zeoclient2
[zeoclient2]
<=zeoclient1
http-address = ${ports:zeoclient2}
ip-address = ${bindips:zeoclient2}
event-log = ${buildout:logdir}/zeoclient2.log
#eggs += sentry-sdk

[zeoclient_debug]
event-log = ${buildout:logdir}/zeoclient_debug.log

# Add additional clients here and add them in parts
#[zeoclientX]
#<=zeoclient1
#http-address = ${ports:zeoclientX}
#ip-address = ${bindips:zeoclientX}

[ports]
# Adjust the ports (e.g. if you run multiple sites without modifying /etc/hosts)
# Edit /etc/hosts so you can use "localip = ${buildout:site}" to run all sites on the same port.
base            = 90
cache           = ${:base}80
loadbalancer    = ${:base}81
zeoclient1      = ${:base}82
zeoclient2      = ${:base}83
zeoclient_debug = ${:base}84
zeoserver       = ${:base}90
instance        = 8080

[bindips]
instance        = 0.0.0.0
zeoserver       = 127.0.0.1
cache           = 127.0.0.1
loadbalancer    = 127.0.0.1
zeoclient1      = 127.0.0.1
zeoclient2      = 127.0.0.1
zeoclient_debug = 127.0.0.1

[monitoring_alerting]
# Max Ram 300 MB is not a lot. This should be adapted to usage patterns.
maxram = 2048
# Was team@starzel.de - the agency that built this site. Alerts belong with
# whoever operates the machine today.
notification_mail = Alexander.Loechel@verwaltung.uni-muenchen.de
subject_ix = ${buildout:site}

[nginx-conf]
recipe = collective.recipe.template
input = templates/nginx.conf
output = ${buildout:directory}/etc/${buildout:site}_nginx.conf
