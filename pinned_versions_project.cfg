[versions]
#
# --- versions we have chosen for a reason
#
# Plone 5.2.10 leaves these five unpinned, so they float: a rebuild picks
# whatever is newest on PyPI at that moment. Production was built in January
# 2023 and got the versions below; a rebuild in August 2026 pulled a different
# set. That matters for the Debian migration, which rebuilds the buildout after
# every distribution step - without pins, a failure after an OS upgrade could
# not be told apart from one caused by silently changed packages.
#
# We tried keeping the newer ones. It does not work: with the newer set the
# Mosaic front page is served as text/plain instead of being passed through the
# transform chain, so it never renders. Measured on 2026-08-14 against a copy
# of the production database:
#
#   old set (below)                          -> text/html,  25450 bytes, renders
#   new set incl. plone.restapi 8.43.3       -> text/plain,  2572 bytes, broken
#   new set with plone.restapi pinned 7.9.1  -> text/plain,  2572 bytes, broken
#
# The last line rules out plone.restapi as the cause, even though its 7.x and
# 8.x lines run in parallel (8.x targets Plone 6, 7.x was maintained for 5.2
# until 7.9.1 in May 2025). One of the remaining four breaks it - most likely
# Zope 4.8.10, since Zope drives the response handling that plone.transformchain
# hooks into. Narrowing that down is worth doing once the deadline is off our
# necks; until then we run what production has proven for three years.
#
# See docs/adr/0001-python-38-fuer-die-debian-bruecke.md
AccessControl = 4.3
RestrictedPython = 5.2
Zope = 4.8.3
plone.namedfile = 5.6.0
plone.restapi = 7.8.1
