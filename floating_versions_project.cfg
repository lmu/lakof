[versions]
# override and extend the hosted floating_versions.cfg
# If a version pinning is ignored here, check pinned_versions_project.cfg
#
# --- versions that were dumped for us - we pin these to keep a known-good set of eggs
#
# Careful when moving to Plone 5.2.15: the wheel of 3.0.5 on PyPI is tagged
# py2-none-any, so on Python 3 the build falls back to the sdist. With the old
# tooling pinned in constraints.txt that is fine - setuptools 42 keeps the dot
# in the egg name. With the newer tooling that 5.2.15 requires, setuptools
# names the egg collective_easyform-... (PEP 625) while zc.buildout looks for
# collective.easyform-..., and the run dies with an AssertionError. Use 3.2.1
# then - the last 3.x with a correct py3 wheel that still declares Plone 5.2.
collective.easyform = 3.0.5
Products.validation = 2.1.3
