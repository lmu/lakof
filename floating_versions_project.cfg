[versions]
# override and extend the hosted floating_versions.cfg
# If a version pinning is ignored here, check pinned_versions_project.cfg
#
# --- versions that were dumped for us - we pin these to keep a known-good set of eggs
#
# 3.0.5 must not be used: its wheel on PyPI is tagged py2-none-any, so on
# Python 3 the build falls back to the sdist. Modern setuptools then names
# the egg collective_easyform-... (PEP 625 normalisation) while zc.buildout
# still looks for collective.easyform-..., and the run dies with an
# AssertionError. 3.2.1 is the last 3.x, ships a correct py3 wheel and still
# declares Plone 5.2.
collective.easyform = 3.2.1
Products.validation = 2.1.3
